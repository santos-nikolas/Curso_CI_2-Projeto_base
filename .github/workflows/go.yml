name: Go

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]

jobs:

  test:
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        go_version: ['1.18', '1.17', '>=1.18']
        os: ['ubuntu-latest', 'ubuntu-22.04']
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: ${{ matrix.go_version }}
      
    - name: Build-DB
      run: docker compose build
      
    - name: Create-DB
      run: docker compose up -d

    - name: Wait for Postgres
      run: |
        set -e
        DB_CONTAINER=$(docker compose ps -q postgres)
        echo "Postgres container: $DB_CONTAINER"

        for i in {1..40}; do
          if docker exec "$DB_CONTAINER" pg_isready -U root -d root; then
            echo "Postgres is ready!"
            exit 0
          fi
          echo "Waiting for Postgres... ($i/40)"
          sleep 1
        done

        echo "Postgres did not become ready in time. Logs:"
        docker compose logs postgres
        exit 1

    - name: Test
      run: go test -v main_test.go 
      
  
  build:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ['ubuntu-latest', 'ubuntu-22.04']
    steps:
    - uses: actions/checkout@v3
    - name: Build
      run: go build -v main.go
